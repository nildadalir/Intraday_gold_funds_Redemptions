# Gold Fund Valuation Report — configuration
# Secrets and machine-specific values use ${ENV_VAR} (never commit real secrets).

paths:
  excel: "data/طلا.xlsx"
  report_template: "report/template.html"
  report_dir: "report"
  output_dir: "output"
  log_dir: "logs"
  raw_dir: "data/raw"
  debug_dir: "data/debug"

batch:
  enabled: true
  # Parallel fund workers (each owns its own HTTP client). 1 = sequential.
  max_workers: 4

api:
  # preferred = pytse_client + finpy_tse (CDN for ETF NAV / fallback)
  # cdn      = direct cdn.tsetmc.com httpx only
  provider: "preferred"
  base_url: "https://cdn.tsetmc.com"
  # Iran-exit HTTP(S)/SOCKS proxy — required when Cursor VPN blocks TSETMC.
  # Example: http://user:pass@host:port  or  socks5://127.0.0.1:1080
  proxy: ${TSETMC_PROXY}
  timeout_seconds: 15
  connect_timeout_seconds: 8
  lib_timeout_seconds: 8
  # Call legacy search.aspx only when CDN has no exact symbol hit.
  search_legacy_fallback: true
  # Stop cascading alternate endpoints after the first network timeout.
  fail_fast_on_timeout: true
  retry:
    max_attempts: 2
    backoff_seconds: 1
  # Raw JSON dumps are slow on batch runs; enable only when debugging.
  save_raw_responses: false
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
    Accept: "application/json, text/plain, */*"
    Accept-Language: "fa-IR,fa;q=0.9,en-US;q=0.8,en;q=0.7"
    Referer: "https://www.tsetmc.com/"
    Origin: "https://www.tsetmc.com"

features:
  use_mock_data: false

# Gold ETF session (IME / commodity funds) — Tehran local time.
# Outside this window live ClientType / boards are often zero or blank.
market_hours:
  timezone: "Asia/Tehran"
  open_weekdays:
    - saturday
    - sunday
    - monday
    - tuesday
    - wednesday
  open_time: "12:00"
  close_time: "18:00"

