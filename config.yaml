# Intra-Day Gold Redemptions — configuration
# Secrets use ${ENV_VAR} only (never commit real secrets).
db:
  server: ${DB_SERVER}
  database: DW
  driver: "ODBC Driver 17 for SQL Server"
  trusted_connection: false  # true = Windows auth; else DB_USERNAME / DB_PASSWORD in .env
  use_db: false  # true gets funds list from database; false uses Excel
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}
  query_file: "src/SQL/FundsList.sql"

paths:
  excel: "data/طلا.xlsx"
  report_template: "report/template.html"
  report_dir: "report"
  output_dir: "output"
  log_dir: "logs"

batch:
  max_workers: 4  # funds processed in parallel (1 = sequential)

logging:
  max_bytes: 1048576
  backup_count: 5
  http_level: WARNING  # httpx/httpcore; INFO logs every GET

api:
  base_url: "https://cdn.tsetmc.com"
  proxy: ${TSETMC_PROXY}
  timeout_seconds: 15
  connect_timeout_seconds: 8
  retry:
    max_attempts: 2
    backoff_seconds: 1
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
    Accept: "application/json, text/plain, */*"
    Accept-Language: "fa-IR,fa;q=0.9,en-US;q=0.8,en;q=0.7"
    Referer: "https://www.tsetmc.com/"
    Origin: "https://www.tsetmc.com"
