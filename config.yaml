# Intra-Day Gold Redemptions — configuration
# Secrets use ${ENV_VAR} only (never commit real secrets).

paths:
  excel: "excel/طلا.xlsx"
  report_template: "report/template.html"
  report_dir: "report"
  output_dir: "output"
  log_dir: "logs"
  raw_dir: "data/raw"

batch:
  max_workers: 1

logging:
  max_bytes: 1048576
  backup_count: 5

api:
  provider: "preferred"
  base_url: "https://cdn.tsetmc.com"
  proxy: ${TSETMC_PROXY}
  timeout_seconds: 15
  connect_timeout_seconds: 8
  lib_timeout_seconds: 8
  fail_fast_on_timeout: true
  retry:
    max_attempts: 2
    backoff_seconds: 1
  save_raw_responses: false
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
    Accept: "application/json, text/plain, */*"
    Accept-Language: "fa-IR,fa;q=0.9,en-US;q=0.8,en;q=0.7"
    Referer: "https://www.tsetmc.com/"
    Origin: "https://www.tsetmc.com"

poc:
  asset_id: "30018"
  instrument: "آتش"
  main_tse_id: "56987424987755487"
  market_tse_id: "32651481214999246"
