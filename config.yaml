# gold_redemptions — configuration
# Secrets use ${ENV_VAR} only (never commit real secrets).
db:
  server: ${DB_SERVER}
  database: DW
  driver: "ODBC Driver 17 for SQL Server"
  trusted_connection: false  # true = Windows auth; else DB_USERNAME / DB_PASSWORD in .env
  use_db: false  # true gets funds list from database; false uses Excel
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}
  query_file: "src/SQL/FundsList.sql"

paths:
  excel: "data/طلا.xlsx"
  report_template: "report/template.html"
  report_dir: "report"
  output_dir: "output"
  output_error_dir: "output_error"
  log_dir: "logs"
  orchestration_log: "logs/orchestration_log.txt"

report:
  basename: gold_redemptions
  file_prefix: intra-day-gold-redemptions
  retention_days: 10  # HTML in output/ and output_error/; 0 = keep forever

# Gold ETF cash market (Tehran). Used only to explain all-zero runs in the log.
market:
  timezone: Asia/Tehran
  open_weekdays: [sat, sun, mon, tue, wed]
  open_time: "12:00"
  close_time: "18:00"

batch:
  max_workers: 4  # funds processed in parallel (1 = sequential)

logging:
  max_bytes: 1048576
  backup_count: 5
  http_level: WARNING  # httpx/httpcore; INFO logs every GET
  retention_days: 100

email:
  send: false  # true = SMTP after a successful output/ report
  to:
    - solhjoo@iidic.com
  cc:
    - navabzadeh@iidic.com
    - dalirnia@iidic.com
  # Subject is set at send time to: gold_redemptions YYYY-MM-DD HH:MM
  body: |
    با سلام و احترام
    گزارش {gold_redemptions} اجرا شده در ساعت {TIME} تاریخ {DATE} پیوست شده است.
    تیم BI
  smtp_server: "192.168.200.6"
  smtp_port: 25
  sender: "dalirnia@iidic.com"
  smtp_retries: 3
  smtp_retry_seconds: 10
  smtp_timeout: 30

api:
  base_url: "https://cdn.tsetmc.com"
  proxy: ${TSETMC_PROXY}
  timeout_seconds: 15
  connect_timeout_seconds: 8
  retry:
    max_attempts: 2
    backoff_seconds: 1
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
    Accept: "application/json, text/plain, */*"
    Accept-Language: "fa-IR,fa;q=0.9,en-US;q=0.8,en;q=0.7"
    Referer: "https://www.tsetmc.com/"
    Origin: "https://www.tsetmc.com"
