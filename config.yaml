# Gold Fund Valuation Report — configuration
# Secrets and machine-specific values use ${ENV_VAR} (never commit real secrets).

paths:
  excel: "data/طلا.xlsx"
  report_template: "report/template.html"
  report_dir: "report"
  output_dir: "output"
  log_dir: "logs"
  raw_dir: "data/raw"
  debug_dir: "data/debug"

batch:
  enabled: true

api:
  # preferred = pytse_client + finpy_tse (CDN for ETF NAV / fallback)
  # cdn      = direct cdn.tsetmc.com httpx only
  provider: "preferred"
  base_url: "https://cdn.tsetmc.com"
  # Iran-exit HTTP(S)/SOCKS proxy — required when Cursor VPN blocks TSETMC.
  # Example: http://user:pass@host:port  or  socks5://127.0.0.1:1080
  proxy: ${TSETMC_PROXY}
  timeout_seconds: 15
  connect_timeout_seconds: 8
  retry:
    max_attempts: 2
    backoff_seconds: 1
  save_raw_responses: true
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
    Accept: "application/json, text/plain, */*"
    Accept-Language: "fa-IR,fa;q=0.9,en-US;q=0.8,en;q=0.7"
    Referer: "https://www.tsetmc.com/"
    Origin: "https://www.tsetmc.com"

features:
  use_mock_data: false

poc:
  symbol: "آتش"
  tse_id: "56987424987755400"

mock:
  atash:
    symbol: "آتش"
    tse_id: "56987424987755400"
    last_price: 33201
    nav_redemption: 33277
    nav_issue_redemption: null
    market_symbol: "آتش2"
    market_tse_id: "99999999999999999"
    legal_buy_volume: 230000000
    legal_sell_volume: 230000000

validation:
  forbidden_mock_market_tse_ids:
    - "99999999999999999"
    - "88888888888888888"

symbols:
  slugs:
    آتش: "atash"
